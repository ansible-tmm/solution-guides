name: Weekly link check

on:
  schedule:
    # Mondays 15:00 UTC (after What's New at 14:00)
    - cron: '0 15 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-link-check
  cancel-in-progress: false

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          format: markdown
          output: link-check-report.md
          args: >-
            --config .lychee.toml
            --no-progress
            README-*.md
            index.md
            README.md
            guide-types.md
            best-practices.md
            reviews.md
            updates.md
            aiops-use-cases.md
            content-type-definition.md

      - name: Prepare report for PR
        if: steps.lychee.outputs.exit_code != '0'
        run: |
          {
            echo "# Link check report"
            echo
            echo "Generated by the **Weekly link check** workflow on \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`."
            echo
            echo "Broken or unreachable outbound links were found in published markdown."
            echo "Humans should fix the links in the guide sources; this PR only carries the report."
            echo
            echo "---"
            echo
            cat link-check-report.md
          } > link-check-report.tmp
          mv link-check-report.tmp link-check-report.md

      - name: Open or update report PR
        if: steps.lychee.outputs.exit_code != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/link-check-report
          delete-branch: false
          title: "chore: link check report (broken outbound URLs)"
          commit-message: "chore: refresh weekly link check report"
          body: |
            Automated weekly lychee run found broken outbound links.

            Review `link-check-report.md`, fix the guide sources on a normal branch, then close this PR.
            This workflow does not delete or rewrite guide content.
          add-paths: |
            link-check-report.md

      - name: Report clean
        if: steps.lychee.outputs.exit_code == '0'
        run: echo "All checked links passed; no report PR opened."
